# Essential Gradle Toolkit defaults — enables automatic Loom, Mixin, and
# loader detection for all subprojects.
essential.defaults.loom=1
essential.defaults.loom.fabric-loader=net.fabricmc:fabric-loader:0.19.3

# Gradle performance
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configureondemand=true

# Suppress Loom version mismatch warnings (expected in multi-version projects)
loom.ignoreDependencyLoomVersionValidation=true
