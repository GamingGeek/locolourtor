name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build all version targets
        run: ./gradlew build

      - name: Collect all jars
        run: |
          mkdir -p artifacts
          find versions -name "locolourtor-*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" -exec cp {} artifacts/ \;

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: locolourtor-jars
          path: artifacts/
